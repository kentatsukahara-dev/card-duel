<title>毒と炎のカード決闘</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: card table seen from one seat — opponents across the felt, log + stage in the middle, your hand at the bottom edge. Single deliberate dark look; the felt recolors per stage. */
:root{
  --felt:#18282e; --felt-2:#203339; --felt-3:#2a4249; --line:#3a555c; --glow:#2a4249;
  --ink:#eef0e8; --muted:#9db0b0; --brass:#d8b26a; --danger:#e25b4f; --ok:#6cc070; --mpc:#4fb3e8;
  --c-atk:#de5a4e; --c-def:#5f8fdc; --c-psn:#a073dc; --c-fire:#ec8a3c; --c-cure:#3fbcac;
  --c-heal:#72c46a; --c-buff:#e2bb4c; --c-debuff:#9095ae; --c-stage:#c9a77c; --c-mp:#4fb3e8; --c-skill:#e05a98; --c-magic:#7a6cf2; --c-draw:#a9c04a; --c-team:#4fd0b8;
  --card:#f3efe4; --card-ink:#1d2528;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-stage=st_swamp]{--felt:#16231a;--felt-2:#223421;--felt-3:#2d4329;--line:#4b6338;--glow:#8a5cc0}
body[data-stage=st_volcano]{--felt:#241211;--felt-2:#3a1914;--felt-3:#4a231b;--line:#713424;--glow:#f0662a}
body[data-stage=st_sanct]{--felt:#192036;--felt-2:#252f4d;--felt-3:#313b5e;--line:#5862a0;--glow:#f2dc96}
body[data-stage=st_fort]{--felt:#1d2024;--felt-2:#2a2e33;--felt-3:#383d44;--line:#5c636b;--glow:#a7b0ba}
body[data-stage=st_arena]{--felt:#281e12;--felt-2:#3a2b18;--felt-3:#4a3820;--line:#765c36;--glow:#e8a84a}
body[data-stage=st_spring]{--felt:#0f2528;--felt-2:#15373b;--felt-3:#1e4a4f;--line:#2f7077;--glow:#4fd8e2}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(ellipse 90% 55% at 50% 105%,color-mix(in srgb,var(--glow) 32%,transparent),transparent 70%),radial-gradient(ellipse at 50% 30%,var(--felt-2),var(--felt) 70%);background-attachment:fixed;background-color:var(--felt);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
#app{max-width:1320px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.top h1{font-size:20px;color:var(--brass)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.18)}
.pill b{color:var(--ink);font-weight:700}
.btn{border:1px solid var(--line);background:var(--felt-3);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:#1d1a12;border-color:var(--brass)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.seat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.seat.dead{opacity:.4}
.seat.ally{background:rgba(120,190,150,.1)}
.teamtag{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-right:6px;color:var(--muted);vertical-align:middle}
.teamtag.ally{color:#a9e0bd;border-color:#a9e0bd}
.seat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seat-h h3{font-size:16px}
.tag{font-size:11px;letter-spacing:.08em;color:var(--brass);border:1px solid var(--brass);border-radius:4px;padding:0 6px}
.hp{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar i.low{background:var(--danger)}
.bar.mp{height:6px}
.bar.mp i{background:var(--mpc)}
.hp .num{font-weight:700;min-width:64px;text-align:right;font-size:13px}
.hp .lb{font-size:11px;color:var(--muted);width:20px;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--cc) 22%,transparent);border:1px solid color-mix(in srgb,var(--cc) 60%,transparent);color:var(--ink);white-space:nowrap}
.chip.hidden{--cc:var(--muted);border-style:dashed}
.sub{font-size:12px;color:var(--muted)}
.mid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px}
@media (max-width:640px){.mid{grid-template-columns:1fr}}
.stage{border:1px solid color-mix(in srgb,var(--glow) 70%,var(--line));border-radius:12px;padding:12px;background:color-mix(in srgb,var(--glow) 12%,transparent)}
.stage-thumb{height:72px;border-radius:8px;margin:-4px -4px 8px;background:#111 center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.stage .sub{color:var(--glow);letter-spacing:.1em}
body:not([data-stage]) .stage .sub,body[data-stage=""] .stage .sub{color:var(--muted)}
.stage h3{font-size:18px;margin:2px 0 4px}
.log{border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-height:150px;overflow-y:auto;font-size:13px;background:rgba(0,0,0,.18)}
.log p{margin:0;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06);color:var(--muted)}
.log p:first-child{color:var(--ink);font-weight:700}
.me{border:1px solid var(--brass);border-radius:14px;padding:14px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:10px}
.me-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.me-h h2{font-size:20px}
.bars{display:flex;flex-direction:column;gap:4px;min-width:220px;flex:1;max-width:420px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.card{--cc:var(--muted);position:relative;background:var(--card);color:var(--card-ink);border-radius:10px;border:none;padding:0;text-align:left;display:flex;flex-direction:column;min-height:158px;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card.sel{outline:3px solid var(--brass);transform:translateY(-6px)}
.card.no{opacity:.55}
.card .band{background:var(--cc);color:#fff;font-size:11px;letter-spacing:.1em;padding:3px 8px;font-weight:700;display:flex;justify-content:space-between;gap:4px}
.card .band .cost{background:rgba(0,0,0,.28);border-radius:4px;padding:0 5px;letter-spacing:0}
.card .nm{font-family:var(--f-display);font-size:16px;padding:6px 8px 2px;line-height:1.25;padding-right:28px}
.card .tx{font-size:12px;padding:0 8px 8px;line-height:1.45;color:#3b4649}
.card .val{position:absolute;right:8px;top:24px;font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);z-index:1}
.card .art{height:64px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--cc) 45%,#fff) 0,var(--cc) 55%,color-mix(in srgb,var(--cc) 70%,#000) 100%)}
.card .art::before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.10) 0 8deg,transparent 8deg 24deg)}
.card .art svg{position:relative;width:44px;height:44px;fill:currentColor;filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
.card .art.pic{height:84px;background-size:cover;background-position:center;background-color:#111}
.card .art.pic::before{display:none}
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.art-grid .item{display:flex;flex-direction:column;gap:6px}
.art-grid .card{cursor:default}.art-grid .card:hover{transform:none}
textarea.paste{width:100%;min-height:90px;background:var(--felt-3);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:12px/1.4 ui-monospace,monospace;padding:8px}
.seat.turn{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.seat .cpu{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.rating{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline}
.rating .big{font-family:var(--f-display);font-size:40px;color:var(--brass);line-height:1}
.rating .tier{font-family:var(--f-display);font-size:18px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.up{color:var(--ok)} .dn{color:var(--danger)}
.thinking{color:var(--brass);font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.title-panel{align-items:stretch;padding-block:12px}
.crest{display:flex;gap:10px}
.crest .av{width:48px;height:48px}.crest .av svg{width:28px;height:28px}
.hero.big{font-size:clamp(34px,8vw,64px);line-height:1.05}
.lead{font-size:16px;color:var(--muted);margin:0}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mbtn{text-align:left;border:1px solid var(--line);background:rgba(0,0,0,.22);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.mbtn b{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--ink)}
.mbtn span{color:var(--muted);font-size:13px}
.mbtn.main{border-color:color-mix(in srgb,var(--brass) 70%,var(--line));background:color-mix(in srgb,var(--brass) 10%,rgba(0,0,0,.2))}
.mbtn:hover{border-color:var(--brass);transform:translateY(-2px)}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--felt-3);border:1px solid var(--line);display:inline-grid;place-items:center;color:var(--brass)}
.av svg{width:22px;height:22px;fill:currentColor}
.pcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(0,0,0,.2)}
.pcard{flex-wrap:wrap}.pcard .prs{margin-left:auto;display:flex;gap:16px}
.pcard .pr{display:flex;flex-direction:column;align-items:flex-end}.pcard .pr.dim{opacity:.45}
.pcard .pr .num{font-family:var(--f-display);font-size:24px;color:var(--brass);line-height:1}
.notice{border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;background:rgba(0,0,0,.2)}
.ok{color:var(--ok);font-size:13px}
.big-btn{font-size:17px;padding:12px 22px}
.icon-pick{display:flex;flex-wrap:wrap;gap:8px}
.ip{position:relative;cursor:pointer}
.ip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ip .av{width:44px;height:44px}
.ip input:checked+span .av{border:2px solid var(--brass);background:color-mix(in srgb,var(--brass) 25%,var(--felt-3))}
.ip input:focus-visible+span .av{outline:2px solid var(--brass);outline-offset:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;border-collapse:collapse;min-width:420px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.tbl tr:last-child td{border-bottom:0}
.tbl .me-row{background:color-mix(in srgb,var(--brass) 12%,transparent)}
.who{display:inline-flex;align-items:center;gap:8px}
.watch-list{display:flex;flex-direction:column;gap:8px}
.watch-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(0,0,0,.2)}
.watch-item .vs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1;min-width:0}
.vs-mark{font-family:var(--f-display);color:var(--danger);margin:0 6px}
.top .sub{letter-spacing:.08em}
.card .mine{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--cc);font-weight:700;letter-spacing:.06em}
[data-cat=atk]{--cc:var(--c-atk)} [data-cat=def]{--cc:var(--c-def)} [data-cat=psn]{--cc:var(--c-psn)} [data-cat=fire]{--cc:var(--c-fire)}
[data-cat=cure]{--cc:var(--c-cure)} [data-cat=heal]{--cc:var(--c-heal)} [data-cat=buff]{--cc:var(--c-buff)} [data-cat=debuff]{--cc:var(--c-debuff)}
[data-cat=stage]{--cc:var(--c-stage)} [data-cat=mp]{--cc:var(--c-mp)} [data-cat=skill]{--cc:var(--c-skill)} [data-cat=magic]{--cc:var(--c-magic)} [data-cat=draw]{--cc:var(--c-draw)} [data-cat=team]{--cc:var(--c-team)}
.combo-chip{font-size:13px;font-weight:700;color:#fff;background:var(--c-skill);border-radius:6px;padding:4px 10px}
.shop{border:1px solid color-mix(in srgb,var(--mpc) 55%,var(--line));border-radius:12px;padding:12px;background:color-mix(in srgb,var(--mpc) 7%,transparent);display:flex;flex-direction:column;gap:10px}
.shop-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.shop-h h3{font-size:17px;color:var(--mpc)}
.shop-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.board{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.board.spec{grid-template-columns:minmax(0,1fr)}
.maincol{display:flex;flex-direction:column;gap:16px;min-width:0}
.shopcol{position:sticky;top:max(12px,env(safe-area-inset-top,0px));min-width:0}
.shopcol .shop-h{flex-direction:column;align-items:stretch;gap:6px}
.shopcol .shop-row{grid-template-columns:minmax(0,1fr);gap:12px}
.shopcol .shop-item .card{min-height:0}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}.shopcol{position:static;order:2}.shopcol .shop-h{flex-direction:row;align-items:center}.shopcol .shop-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.shop-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.shop-item{display:flex;flex-direction:column;gap:6px;min-width:0}
.shop-item .card{min-height:130px;cursor:default}.shop-item .card:hover{transform:none}
.card .rare{position:absolute;left:8px;bottom:4px;font-size:10px;font-weight:700;color:var(--cc);letter-spacing:.08em}
.peek{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.peek .card{cursor:default;min-height:130px}.peek .card:hover{transform:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .why{color:var(--danger);font-size:13px}
.actions .grow{flex:1}
.ov{position:fixed;inset:0;background:var(--felt);z-index:20;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov.dim{background:rgba(10,18,20,.94)}
.panel{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.panel.wide{max-width:980px}
.hero{font-size:clamp(28px,6vw,44px);color:var(--brass);line-height:1.15}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.form label.check{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.form input,.form select{background:var(--felt-3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;font-size:15px;width:100%;min-width:0}
.form input[type=checkbox]{width:18px;height:18px}
.box{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.box h2{font-size:18px}
.maker{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;align-items:start}
@media (max-width:560px){.maker{grid-template-columns:1fr}}
.maker .card{cursor:default}.maker .card:hover{transform:none}
.err{color:var(--danger);font-size:13px;min-height:1em}
.rules ul{margin:4px 0;padding-left:20px}
.rules li{margin:2px 0}
.cat-h{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.cat-h h3{font-size:17px;color:var(--cc)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cat-grid .card{min-height:130px;cursor:default}
.cat-grid .card:hover{transform:none}
.cnt{position:absolute;right:6px;bottom:4px;font-size:11px;color:#6b7578}
.mycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mycards .item{display:flex;flex-direction:column;gap:6px}
.mycards .card{cursor:default;min-height:130px}.mycards .card:hover{transform:none}
.pass-notes{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 14px;color:var(--muted)}
.pass-notes p{margin:2px 0}
.toast{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
.toast div{font-family:var(--f-display);font-size:clamp(34px,9vw,72px);color:var(--glow);text-shadow:0 0 30px color-mix(in srgb,var(--glow) 60%,transparent);animation:stageIn 1.8s ease forwards;text-align:center}
.toast small{display:block;font-family:var(--f-body);font-size:16px;color:var(--ink);text-shadow:none}
@keyframes stageIn{0%{opacity:0;transform:scale(.9)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
.fxl{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.fx-glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,color-mix(in srgb,var(--fx) 34%,transparent),transparent 58%);animation:fxGlow 1s ease forwards}
.fx-card{position:absolute;left:50%;top:46%;width:clamp(132px,30vw,190px);opacity:0;filter:drop-shadow(0 0 22px var(--fx));animation:fxCard 1s cubic-bezier(.2,.8,.3,1) forwards}
.fx-card .card{width:100%;pointer-events:none;margin:0}
.fx-back{display:grid;place-items:center;aspect-ratio:3/4;border-radius:12px;border:2px solid var(--fx);background:repeating-linear-gradient(45deg,#1b2a33 0 10px,#223743 10px 20px);color:var(--ink);font-weight:700}
.fx-cap{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:8px;white-space:nowrap;padding:3px 12px;border-radius:99px;background:rgba(0,0,0,.72);color:var(--ink);font-size:13px}
.fx-combo{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;white-space:nowrap;font-family:var(--f-display);font-size:clamp(18px,4.4vw,28px);color:var(--brass);text-shadow:0 0 14px var(--fx),0 2px 4px #000}
.fx-hit{position:absolute;border-radius:14px;background:var(--fx);opacity:0;animation:fxHit .5s ease-out .38s forwards}
.fx-slash{position:absolute;height:5px;border-radius:9px;background:linear-gradient(90deg,transparent,#fff 45%,var(--fx) 70%,transparent);opacity:0;animation:fxSlash .3s ease-out var(--dl) forwards}
.fx-dot{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:var(--fx);box-shadow:0 0 10px var(--fx);opacity:0;animation:fxDot .62s ease-out var(--dl) forwards}

function applyRating(){

function statSrc(){return(typeof NET!=='undefined'&&NET.db&&NET.uid&&NET.me)?NET.me:UI.rating}
function getStats(kind){const s=statSrc(),[r,g,w]=KF[kind||'online'];

function recordResult(kind,delta,res,label,mid){

/* ---------- CPU ---------- */
function evalState(me){
  const p=G.players[me];if(G.over&&G.cfg.team)return G.winTeam===me%2?1e5:-1e5;if(!p.alive||p.hp<=0)return -1e5;
  if(G.over&&G.over===p.name)return 1e5;
  const sumB=a=>a.reduce((s,b)=>s+b.amt*b.t,0);
  let s=p.hp*1.0+p.mp*0.25+p.shields.reduce((a,v)=>a+v,0)*0.6+(p.counter?1.5:0)+(p.parry?1.5:0)+(p.mirror?2:0)+(p.wall?3:0)
    +p.thorns*0.8+p.barrier*0.8+(p.guts?3:0)+(p.phoenix?6:0)+p.regen*1.5+sumB(p.buffs)*0.5+(p.allin?2:0)+(p.keen?1:0)+(p.whet?1.5:0)
    +(p.rally?1.5:0)+(p.toxify?1:0)-p.poison*1.5-p.delayed.length*3-p.inflame*1-sumB(p.debuffs)*0.5+p.hand.length*0.6+(p.max-30)*0.5;
  G.players.forEach((o,j)=>{if(j===me)return;if(G.cfg.team&&j%2===me%2){s+=o.alive&&o.hp>0?o.hp*0.8-o.poison*1.2-o.delayed.length*2-o.inflame*0.8-sumB(o.debuffs)*0.4+o.shields.reduce((a,v)=>a+v,0)*0.5+o.mp*0.3+o.hand.length*0.5+(o.coverBy!=null?(o.hp<=12?4:1):0):-30;return}if(!o.alive||o.hp<=0){s+=40;return}
    s-=o.hp*1.2-o.poison*1.5-o.delayed.length*3-o.inflame*1.2+o.shields.reduce((a,v)=>a+v,0)*0.5+o.mp*0.15+o.hand.length*0.3-(o.skip?6:0)-(o.snared?2:0)-sumB(o.debuffs)*0.5});
  return s}
function cpuActions(){const p=cur(),acts=[];
  p.hand.forEach((c,i)=>{if(whyNot(c))return;const d=CARDS[c.k];
    const tg=d.ally?allyTargets(d):(d.aoe||(isAtk(d)&&p.rally)||!needsTarget(d))?[null]:neighbors(G.cur);tg.forEach(t=>acts.push({i,t}))});
  return acts}
function simValue(a,me,depth){
  const snap=JSON.stringify(G),us=UI.sel,up=UI.peek,was=SIM;SIM=true;
  try{play(a.i,a.t)}catch(e){}
  let v=evalState(me);
  if(depth>0&&!G.over&&G.played<G.maxPlays){cpuActions().forEach(b=>{const v2=simValue(b,me,0);if(v2>v)v=v2})}
  G=JSON.parse(snap);UI.sel=us;UI.peek=up;SIM=was;return v}
function cpuChoose(){
  const me=G.cur,lvl=cur().diff,acts=cpuActions();if(!acts.length)return null;
  if(lvl==='easy'&&Math.random()<.4)return acts[Math.floor(Math.random()*acts.length)];
  let best=null,bv=evalState(me)+0.3;
  acts.forEach(a=>{let v=simValue(a,me,lvl==='hard'?1:0);if(lvl==='easy')v+=Math.random()*6-3;if(v>bv){bv=v;best=a}});
  return best}
function doBuy(i){const p=cur(),c=G.shop.splice(i,1)[0],d=CARDS[c.k];p.mp-=price(d);p.hand.push(c);G.bought=true;log(`${p.name}はショップで「${d.name}」を買った（MP${price(d)}）`);fillShop()}
function cpuBuy(){
  const me=G.cur,lvl=cur().diff;const ok=[0,1,2].filter(i=>!whyNotBuy(i));if(!ok.length)return;
  if(lvl==='easy'){if(Math.random()<.35)doBuy(ok[Math.floor(Math.random()*ok.length)]);return}
  const bestPlay=()=>{let v=evalState(me);cpuActions().forEach(a=>{const x=simValue(a,me,0);if(x>v)v=x});return v};
  const base=bestPlay();let pick=-1,pv=base+0.8;
  ok.forEach(i=>{const snap=JSON.stringify(G);SIM=true;doBuy(i);const v=bestPlay();G=JSON.parse(snap);SIM=false;if(v>pv){pv=v;pick=i}});

function cpuStep(){

    if(w>=0&&!G.discarded){const c=p.hand.splice(w,1)[0];G.discarded=true;log(`${p.name}は「${CARDS[c.k].name}」を捨てた`)}}

function scheduleCpu(){if(G&&!G.over&&cur().cpu&&!UI.cpuTimer&&!UI.catalog){UI.cpuTimer=setTimeout(()=>{UI.cpuTimer=null;if(!G||G.over||!cur().cpu)return;cpuStep();render()},G.cpuN?1150:1300)}}
function beginTurn(){

  p.delayed.filter(d=>d.t<=0).forEach(d=>{p.poison+=d.amt;log(`${p.name}の遅効毒が発動。毒+${d.amt}`)});

  else if(a.type==='reroll'&&p.mp>=1){p.mp--;G.shop=[];fillShop();log(`${p.name}がショップの品ぞろえを入れ替えた`)}
  else if(a.type==='discard'&&!G.discarded&&i>=0&&i<p.hand.length){const c=p.hand.splice(i,1)[0];G.discarded=true;UI.sel=null;log(`${p.name}は「${CARDS[c.k].name}」を捨てた`)}}
function act(a){
  if(!G)return;
  if(G.cfg.vs==='online'&&!NET.isHost){
    if(!NET.mroom)return;UI.sel=null;UI.waiting=true;
    NET.mroom.emit('act',{...a,seq:G.seq}).catch(()=>{UI.waiting=false;NET.status='送信できませんでした。もう一度押してください';render()});
    render();return}
  applyAct(a);afterChange()}
function afterChange(){if(G&&G.cfg.vs==='online'){if(G.over)onOver();persist()}render()}
function finishBy(seat,msg){if(!G||G.over)return;G.over=G.players[seat].name;G.winnerSeat=seat;G.end=Date.now();G.phase='over';log(msg);afterChange()}
function dropSeat(s,msg){const p=G.players[s];if(p)p.left=true;if(!p||!p.alive||G.over)return;p.guts=p.phoenix=false;p.hp=0;log(msg);const turn=G.cur===s;if(!checkDeaths()&&turn)advance();afterChange()}
function resign(){if(!G||G.over||G.cfg.vs!=='online')return;
  if(NET.isHost){if(G.cfg.team)dropSeat(0,`${G.players[0].name}が降参しました`);else finishBy(1,`${G.players[0].name}が降参しました`)}
  else if(NET.mroom)NET.mroom.emit('act',{type:'resign'}).catch(()=>{})}
function onOver(){
  if(!G||G.cfg.vs!=='online'||NET.spectating||!G.net)return;const mid=G.net.mid;
  if(NET.ratedSet.has(mid))return;NET.ratedSet.add(mid);
  if(G.cfg.team){NET.room&&NET.room.presence({mode:'idle',match:null}).catch(()=>{});return}
  const st=getStats('online');if(st.hist.some(h=>h.mid===mid))return;
  const opp=NET.seat===0?G.net.guest:G.net.host;
  const S=G.winnerSeat==null||G.winnerSeat<0?.5:G.winnerSeat===NET.seat?1:0;
  const E=1/(1+10**(((opp.rating??1500)-st.rating)/400));
  recordResult('online',Math.round(32*(S-E)),S===1?'勝ち':S===.5?'引き分け':'負け','オンライン',mid);
  NET.room&&NET.room.presence({mode:'idle',match:null}).catch(()=>{})}
function leaveMatch(){
  if(NET.unsubMatch){NET.unsubMatch();NET.unsubMatch=null}
  if(NET.mroom){NET.mroom.leave().catch(()=>{});NET.mroom=null}
  if(NET.joinWait){clearTimeout(NET.joinWait);NET.joinWait=null}
  NET.matchId=null;NET.isHost=false;NET.seat=null;G=null;UI.screen='online';
  NET.room&&NET.room.presence({mode:'idle',match:null,since:null}).catch(()=>{});render()}
function watchList(){if(NET.watchListOn||!NET.db)return;NET.watchListOn=true;

    NET.matches=s.docs.map(d=>d.data()).filter(m=>m&&Date.now()-(m.updated||0)<15*60000).sort((a,b)=>(b.updated||0)-(a.updated||0));softRender()},()=>{})}
function startWatch(mid){if(!NET.db)return;NET.spectating=true;G=null;UI.screen='game';
  NET.unsubWatch=NET.db.doc('matches/'+mid).onSnapshot(s=>{if(!s.exists)return;const d=s.data();if(!d||!d.G)return;

const ART_OK=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;

function applyArtStyles(){if(typeof document.getElementById!=='function')return;let el=document.getElementById('artcss');

function artKeyFrom(name){let k=String(name||'').toLowerCase().replace(/\.(jpe?g|png|webp)$/,'').replace(/^cardart_|^card_/,'').trim();
  if(BASE[k]||/^cu_[a-z0-9]+$/.test(k)||/^bg_st_[a-z]+$/.test(k)&&BASE[k.slice(3)])return k;

async function saveArtMap(map){
  if(!NET.db||!NET.canEdit){UI.err='絵柄を登録できるのはページの持ち主・編集者だけです';render();return}
  let ok=0,bad=[];
  for(const [name,img] of Object.entries(map)){const k=artKeyFrom(name);
    if(!k||!ART_OK.test(img)||img.length>(k.startsWith('bg_')?250000:200000)){bad.push(name);continue}
    try{await NET.db.doc('cardart/'+k).set({img,updated:Date.now()});ok++}catch(e){bad.push(name)}}
  UI.msg=`${ok}枚を登録しました`;UI.err=bad.length?`登録できなかったもの：${bad.join('、')}`:'';render()}

function fileToData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{

  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320);res(c.toDataURL('image/jpeg',0.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}

    <div class="sub">{"slash":"data:image/jpeg;base64,…"} の形のデータを貼り付けます（Grokの画面からまとめて移すとき用）。</div>
    <textarea id="art-json" class="paste" placeholder="ここに貼り付け"></textarea>
    <div class="actions"><button class="btn primary" data-act="artjson">貼り付けたデータを登録</button></div></div>
  <div class="box"><h2>書き出し</h2><div class="sub">登録済みの絵柄をまとめて cardart.json に保存します（別のサーバーへ移すとき用）。</div>
    <div class="actions"><button class="btn" data-act="artexport">絵柄をファイルに書き出す</button></div></div>
  <div class="actions"><span class="err">${esc(UI.err)}</span><span class="ok">${esc(UI.msg||'')}</span></div>`}
  <div class="box"><h2>登録済みの絵柄（${keys.length}枚）</h2>
    ${keys.length?`<div class="art-grid">${keys.filter(k=>CARDS[k]).map(k=>`<div class="item">${cardHtml({k},'','tabindex="-1"')}${NET.canEdit?`<button class="btn small" data-act="artdel" data-k="${k}">絵柄を外す</button>`:''}</div>`).join('')}</div>`:'<p class="sub">まだ登録された絵柄はありません。</p>'}</div></div>`}

/* ---------- start helpers ---------- */
function readCustomCfg(){const c=UI.cfg,v=id=>{const el=$('#'+id);return el?el.value:''};
  c.vs=v('f-vs')||'cpu';c.diff=v('f-diff')||'normal';c.team=v('f-n')==='team';c.n=c.team?4:+v('f-n')||2;c.hp=Math.max(5,Math.min(99,+v('f-hp')||30));c.hand=Math.max(3,Math.min(10,+v('f-hand')||6));
  c.deckMode=v('f-mode')||'standard';c.deckSize=v('f-size')||'set';
  const m=$('#f-mine'),a=$('#f-all');c.useMine=m?m.checked:true;c.useAll=a?a.checked:false;
  for(let i=0;i<4;i++){const x=v('f-name'+i).trim();c.names[i]=x||(i===0?myName():'プレイヤー'+(i+1))}}
function startCustom(){readCustomCfg();const c=UI.cfg;
  const list=[...(c.useMine?myCards():[]),...(c.useAll?othersCards():[])].slice(0,60);
  newGame({vs:c.vs==='cpu'?'cpu':'hot',rated:false,diff:c.diff,n:c.n,team:!!c.team,label:c.team?'カスタム 2対2':undefined,hp:c.hp,hand:c.hand,deckMode:c.deckMode,deckSize:c.deckSize,custom:list,names:c.names.slice()});UI.screen='game'}
function startCpuRated(){const df=diffFor(getStats('cpu').rating);
  newGame({...FIXED,vs:'cpu',rated:true,diff:df,names:[myName(),'CPU']});UI.screen='game'}
function startCpuTeam(){const df=diffFor(getStats('cpu').rating);
  newGame({...FIXED,n:4,team:true,vs:'cpu',rated:false,diff:df,label:'CPU 2対2',names:[myName(),'','','']});UI.screen='game'}
function startLocal(){const c=UI.cfg,lv=($('#l-n')||{}).value;c.team=lv==='team';c.n=c.team?4:+lv||2;
  for(let i=0;i<4;i++){const el=$('#l-name'+i);c.names[i]=(el&&el.value.trim())||'プレイヤー'+(i+1)}
  newGame({...FIXED,vs:'hot',rated:false,label:c.team?'ひとつの端末で 2対2':'ひとつの端末で対戦',n:c.n,team:!!c.team,names:c.names.slice()});UI.screen='game'}

/* ---------- custom card maker ---------- */
const CU_FIELDS=[['cost','必要MP',0,10],['dmg','ダメージ',0,15],['hits','攻撃回数',1,6],['poison','毒',0,8],['inflame','炎症ターン',0,5],['heal','回復',0,15],['shieldVal','盾の数値',0,6],['mp','MP回復',0,6],['atkUp','攻撃+（2ターン）',0,5],['self','自分へのダメージ',0,10],['draw','カードを引く',0,3],['n','山札の枚数',1,5]];
function cuText(c){const t=[];
  if(c.dmg)t.push(`${c.dmg}ダメージ${c.hits>1?`×${c.hits}回`:''}${c.pierce?'（盾無視）':''}`);
  if(c.poison)t.push(`毒+${c.poison}`);if(c.inflame)t.push(`炎症${c.inflame}ターン`);
  if(c.heal)t.push(`体力+${c.heal}`);if(c.shieldVal)t.push(`盾${c.shieldVal}を伏せる`);
  if(c.mp)t.push(`MP+${c.mp}`);if(c.atkUp)t.push(`2ターン攻撃+${c.atkUp}`);
  if(c.self)t.push(`自分に${c.self}ダメージ`);if(c.draw)t.push(`${c.draw}枚引く`);
  return t.join('。')||'効果なし'}
function readCu(){const c={name:($('#cu-name').value||'').trim().slice(0,10),cat:$('#cu-cat').value,pierce:$('#cu-pierce').checked?1:0,custom:1};
  CU_FIELDS.forEach(([k,,mn,mx])=>{c[k]=Math.max(mn,Math.min(mx,Math.floor(+$('#cu-'+k).value||0)))});
  if(!c.dmg){c.hits=1;c.pierce=0}c.text=cuText(c);return c}
function cuPreview(){const el=document.getElementById&&document.getElementById('cu-prev');if(el){const c=readCu();el.innerHTML=cardHtml({k:'_prev'},'','tabindex="-1"',{...c,name:c.name||'（名前）'})}}

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('cu-'))cuPreview()});
document.addEventListener('change',e=>{if(e.target.id&&e.target.id.startsWith('cu-'))cuPreview()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(['sel','use','discard','end','buy','reroll'].includes(a)&&!isHumanTurn())return;
  UI.err='';if(a!=='saveprofile'&&a!=='cuadd'&&a!=='cudel')UI.msg='';
  if(a==='go'){UI.screen=b.dataset.s;if(UI.screen==='watch')watchList()}
  else if(a==='totitle'){if(UI.cpuTimer){clearTimeout(UI.cpuTimer);UI.cpuTimer=null}G=null;UI.screen='title';if(NET.queue)stopQueue()}
  else if(a==='sound')sndToggle();
  else if(a==='catalog')UI.catalog=true;
  else if(a==='closecat')UI.catalog=false;
  else if(a==='startcpu')startCpuRated();
  else if(a==='startcpu2')startCpuTeam();
  else if(a==='startlocal')startLocal();
  else if(a==='startcustom')startCustom();
  else if(a==='again'){const cfg=G.cfg;if(cfg.rated&&cfg.vs==='cpu')startCpuRated();else newGame(cfg)}
  else if(a==='reveal')G.phase='play';
  else if(a==='sel'){const i=+b.dataset.i;UI.sel=UI.sel===i?null:i}
  else if(a==='use'){act({type:'play',i:UI.sel,t:b.dataset.t!=null?+b.dataset.t:null});UI.sel=null;return}
  else if(a==='discard'){act({type:'discard',i:UI.sel});UI.sel=null;return}
  else if(a==='end'){UI.sel=null;act({type:'end'});return}
  else if(a==='buy'){act({type:'buy',i:+b.dataset.i});return}
  else if(a==='reroll'){act({type:'reroll'});return}
  else if(a==='closepeek'){UI.peekClosed=G.turn+':'+G.peek.t}
  else if(a==='rankkind')UI.rankKind=b.dataset.k;
  else if(a==='artjson'){saveArtJson();return}
  else if(a==='artexport'){exportArt();return}
  else if(a==='artfiles'){saveArtFiles();return}
  else if(a==='artdel'){if(NET.db&&NET.canEdit)NET.db.doc('cardart/'+b.dataset.k).delete().catch(()=>{});return}
  else if(a==='queue')startQueue(b.dataset.f);
  else if(a==='unqueue'){stopQueue();NET.status='オンライン'}
  else if(a==='resign')resign();
  else if(a==='leavematch'){leaveMatch();return}
  else if(a==='watch'){startWatch(b.dataset.m);return}
  else if(a==='stopwatch'){stopWatch();return}
  else if(a==='saveprofile'){saveProfile();return}
  else if(a==='cuadd'){const c=readCu();const mine=myCards();
    if(!c.name)UI.err='カードの名前を入れてください';
    else if(c.text==='効果なし')UI.err='効果を1つ以上入れてください';
    else if(mine.length>=30)UI.err='作れるカードは30種までです';
    else{c.key='cu_'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);saveMyCards([...mine,c]);return}}
  else if(a==='cudel'){const mine=myCards().slice();mine.splice(+b.dataset.i,1);saveMyCards(mine);return}
  render()});
setInterval(()=>{
  if(!G)return;const el=$('#clock');if(el&&!G.end)el.textContent=fmt(Date.now()-G.start);
  if(G.cfg.vs!=='online'||G.over||NET.spectating)return;
  const left=Math.max(0,TURN_SEC-Math.floor((Date.now()-(G.turnStart||Date.now()))/1000));const tl=$('#tleft');if(tl)tl.textContent=left;
  if(NET.mroom){const on=new Set(NET.mroom.peers().map(p=>p.peer));NET.others.forEach(o=>{if(on.has(o))NET.seen[o]=Date.now()})}
  if(NET.isHost&&left<=0){log(`${cur().name}の時間切れ`);advance();afterChange();return}
  if(!G.net)return;const gone=p=>Date.now()-(NET.seen[p]||0)>30000;
  if(NET.isHost){G.net.seats.forEach((s,i)=>{if(i===0||G.over||!G.players[i].alive||!gone(s.peer))return;
      if(G.cfg.team)dropSeat(i,`${G.players[i].name}の接続が切れました`);else finishBy(0,'相手の接続が切れたため勝利')})}
  else if(gone(NET.hostPeer)){
    if(G.cfg.team){G.over='引き分け';G.winnerSeat=-1;G.winTeam=-1;log('部屋を管理している人の接続が切れたため、対戦を終了しました')}
    else{G.over=G.players[1].name;G.winnerSeat=1;log('相手の接続が切れたため勝利')}
    G.end=Date.now();G.phase='over';
    NET.db.doc('matches/'+G.net.mid).update({status:'done',winnerSeat:G.winnerSeat,G:snapG(),updated:Date.now()}).catch(()=>{});onOver();render()}
},1000);
function routeHash(){if(location.hash==='#watch'){UI.screen='watch';UI.watchOnly=true;if(!G)render();watchList()}}
window.addEventListener('hashchange',routeHash);
window.claude?.hot?.snapshot?.(()=>({G:G&&G.cfg.vs!=='online'&&!NET.spectating?G:null,cfg:UI.cfg,screen:UI.screen}));
const boot=d=>{if(d&&d.cfg)UI.cfg={...UI.cfg,...d.cfg};if(d&&d.screen&&d.screen!=='game')UI.screen=d.screen;
  if(d&&d.G&&d.G.players&&Array.isArray(d.G.out)&&d.G.cfg&&d.G.cfg.vs!=='online'){G=d.G;UI.screen='game';installCustom(G.cfg.custom)}
  routeHash();render();netInit()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
